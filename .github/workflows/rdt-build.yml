name: RDT SEO Engine Build Check
on:
  push:
    branches: [resideterra]
    paths:
      - 'rdt/**'
      - '.github/workflows/rdt-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rdt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
