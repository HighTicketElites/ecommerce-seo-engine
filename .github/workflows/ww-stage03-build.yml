name: WW Stage 03 Build Check
on:
  push:
    branches: [main]
    paths:
      - 'ww-stage03/**'
      - '.github/workflows/ww-stage03-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ww-stage03
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
