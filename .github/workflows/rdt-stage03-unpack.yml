name: RDT Stage03 Unpack Diagnostic

on:
  push:
    branches:
      - resideterra-stage03
    paths:
      - ".github/workflows/rdt-stage03-unpack.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: resideterra-stage03
          fetch-depth: 0

      - name: Diagnose and materialize Stage03 bundle
        shell: bash
        run: |
          set +e
          DIAG="rdt-stage03/UNPACK_DIAGNOSTIC.txt"
          : > "$DIAG"
          echo "branch=$(git branch --show-current)" >> "$DIAG"
          echo "parts:" >> "$DIAG"
          ls -l rdt-stage03/bundle.part.* >> "$DIAG" 2>&1

          cat rdt-stage03/bundle.part.* | tr -d '\n\r ' | base64 --decode > /tmp/rdt-stage03.tgz
          echo "base64_decode=$?" >> "$DIAG"
          ls -lh /tmp/rdt-stage03.tgz >> "$DIAG" 2>&1

          gzip -t /tmp/rdt-stage03.tgz
          echo "gzip_test=$?" >> "$DIAG"

          tar -tzf /tmp/rdt-stage03.tgz > /tmp/tar-list.txt 2>&1
          TL=$?
          echo "tar_list=$TL" >> "$DIAG"
          echo "tar listing:" >> "$DIAG"
          head -80 /tmp/tar-list.txt >> "$DIAG"

          rm -rf /tmp/rdt-stage03-src
          mkdir -p /tmp/rdt-stage03-src
          tar -xzf /tmp/rdt-stage03.tgz -C /tmp/rdt-stage03-src
          echo "tar_extract=$?" >> "$DIAG"

          echo "package candidates:" >> "$DIAG"
          find /tmp/rdt-stage03-src -maxdepth 8 -name package.json -type f -print >> "$DIAG" 2>&1
          PKG="$(find /tmp/rdt-stage03-src -maxdepth 8 -name package.json -type f | head -n 1)"
          echo "pkg=$PKG" >> "$DIAG"

          if [ -n "$PKG" ]; then
            SRC="$(dirname "$PKG")"
            echo "src=$SRC" >> "$DIAG"
            echo "src listing:" >> "$DIAG"
            find "$SRC" -maxdepth 2 -type f | sort | head -120 >> "$DIAG" 2>&1

            if [ -d "$SRC/app" ] && [ -d "$SRC/lib" ] && [ -d "$SRC/data" ]; then
              echo "source_shape=valid" >> "$DIAG"
              find rdt-stage03 -mindepth 1 -maxdepth 1 \
                ! -name 'bundle.part.*' \
                ! -name 'runtime.part.*' \
                ! -name 'UNPACK_DIAGNOSTIC.txt' \
                -exec rm -rf {} +
              cp -a "$SRC"/. rdt-stage03/
              rm -f rdt-stage03/bootstrap.mjs
              echo "materialized=yes" >> "$DIAG"
            else
              echo "source_shape=invalid" >> "$DIAG"
            fi
          else
            echo "source_shape=no_package" >> "$DIAG"
          fi

      - name: Commit diagnostic and materialized source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rdt-stage03
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Diagnose and materialize RDT Stage03 source"
          git push origin HEAD:resideterra-stage03
