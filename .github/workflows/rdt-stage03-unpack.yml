name: RDT Stage03 Unpack and Validate

on:
  push:
    branches:
      - resideterra-stage03
    paths:
      - ".github/workflows/rdt-stage03-unpack.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: resideterra-stage03
          fetch-depth: 0

      - name: Unpack Stage03 source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, io, tarfile, pathlib, shutil

          root = pathlib.Path("rdt-stage03")
          encoded = (root / "runtime.part.00").read_text().strip()
          payload = base64.b64decode(encoded)
          print("decoded runtime bytes:", len(payload))

          tmp = pathlib.Path("/tmp/rdt-stage03-src")
          shutil.rmtree(tmp, ignore_errors=True)
          tmp.mkdir(parents=True)

          with tarfile.open(fileobj=io.BytesIO(payload), mode="r:gz") as tf:
              names = tf.getnames()
              print("archive files:", len(names))
              print("\n".join(names[:40]))
              tf.extractall(tmp)

          pkgs = list(tmp.rglob("package.json"))
          if not pkgs:
              raise SystemExit("package.json not found in runtime archive")
          src = pkgs[0].parent
          print("source root:", src)

          keep = {"runtime.part.00", "bundle.part.00", "bundle.part.01", "bundle.part.02", "bundle.part.03", "DEPLOYMENT.md"}
          for child in list(root.iterdir()):
              if child.name in keep:
                  continue
              if child.is_dir():
                  shutil.rmtree(child)
              else:
                  child.unlink()

          for child in src.iterdir():
              dest = root / child.name
              if child.is_dir():
                  shutil.copytree(child, dest, dirs_exist_ok=True)
              else:
                  shutil.copy2(child, dest)

          for name in ["runtime.part.00","bundle.part.00","bundle.part.01","bundle.part.02","bundle.part.03","bootstrap.mjs"]:
              p=root/name
              if p.exists():
                  p.unlink()

          required=["package.json","app","lib","data"]
          missing=[x for x in required if not (root/x).exists()]
          if missing:
              raise SystemExit(f"missing required source: {missing}")
          PY

      - name: Validate Stage03 source
        working-directory: rdt-stage03
        run: |
          npm install
          npm test
          npm run validate

      - name: Commit unpacked source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rdt-stage03
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Materialize RDT Stage03 source for Vercel"
          git push origin HEAD:resideterra-stage03
